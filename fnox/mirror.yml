extends: ../mirror-base.yml

name: fnox

# Logical index package `jdx/fnox` at the physical path
# `ghcr.io/ocx-contrib/jdx/fnox` — slash segments, never hyphen-flattened. The
# first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
#
# Succeeds the flat `ocx.sh/fnox` coordinate this repository published before
# the grouped layout, the same way mirror-kitware/cmake succeeds mirror-cmake.
target:
  registry: ghcr.io
  repository: ocx-contrib/jdx/fnox

source:
  type: github_release
  owner: jdx
  repo: fnox
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# fnox is a Rust build and upstream ships BOTH a `-gnu` and a `-musl` Linux
# build per arch. Measured on v1.32.0:
#
#   $ file fnox   # from fnox-x86_64-unknown-linux-musl.tar.gz
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, not stripped
#   $ readelf -l … | grep INTERP  → (none)
#   $ readelf -d … | grep NEEDED  → (none)
#   $ file fnox   # from fnox-aarch64-unknown-linux-musl.tar.gz
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, not stripped
#
# No PT_INTERP and no DT_NEEDED means the musl artifact requires nothing of the
# host, so both Linux keys are BARE — no `+libc.*` suffix. Container legs
# (ubuntu + alpine + fedora) live in ../mirror-base.yml and are what turn that
# claim into evidence.
#
# The `-gnu` twin is deliberately NOT mirrored. It is dynamically linked and
# pulls in `libudev.so.1` and `libgcc_s.so.1` beyond the base glibc set, and
# `os.features` can only express a libc FAMILY — a `+libc.glibc` key could
# never state the libudev requirement, so a glibc host would satisfy the
# declared claim while the binary still failed to start (the pnpm/libatomic
# failure mode). Listing both would also be an ambiguous same-version match on
# one platform key, which is a hard error.
#
# ⚠️ CAPABILITY DELTA (Linux only). The musl build is not merely a different
# link mode — it is a smaller feature set, and upstream says so in
# crates/fnox-core/Cargo.toml:
#
#   # ctap-hid-fido2 → hidapi → libudev cannot be statically linked on musl,
#   # so the FIDO2 provider is excluded from musl builds.
#   [target.'cfg(not(target_env = "musl"))'.dependencies]
#   ctap-hid-fido2 = { workspace = true }
#
# Observable on v1.32.0: `fnox provider add --help` lists 24 provider types on
# the gnu build and 23 on the musl build — the missing one is exactly
# `fido2: FIDO2 hmac-secret hardware-backed encryption`. Everything else,
# including the `yubikey` HMAC-SHA1 provider, is present in both. macOS and
# Windows are unaffected (neither is a musl target), so the delta is
# Linux-only. Shipping the gnu build to recover `fido2` is not an option — see
# the paragraph above — and one unexpressible-requirement platform key is worse
# than one absent provider on Linux.
#
# ─── Scope (verified against v1.25.0, the first in-range release, and v1.32.0)
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   fnox-{x86_64,aarch64}-unknown-linux-gnu.tar.gz  — see the capability note
#
# Resolution verified BOTH ways across EVERY in-range release: each of the six
# patterns matches EXACTLY one asset in all of them except v1.27.0, an aborted
# upstream release carrying ZERO assets on every platform (published
# 2026-06-18, not a draft, not a prerelease). A pattern matching zero is
# silently skipped rather than an error — for v1.27.0 that skips the whole
# version, which is the correct outcome: there is nothing to mirror.
assets:
  linux/amd64:
    - "^fnox-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "^fnox-aarch64-unknown-linux-musl\\.tar\\.gz$"
  darwin/amd64:
    - "^fnox-x86_64-apple-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "^fnox-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    - "^fnox-x86_64-pc-windows-msvc\\.zip$"
  windows/arm64:
    - "^fnox-aarch64-pc-windows-msvc\\.zip$"

asset_type:
  # The binary (fnox / fnox.exe) sits at the archive ROOT on every platform —
  # no wrapper directory to strip, and no bin/ dir, which is why
  # ../mirror-base.yml must run with `bin_scan: off`.
  type: archive
  strip_components: 0

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  min: "1.25.0"
  new_per_run: 5
  poll_interval: "58 0-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: fnox/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/jdx/fnox/license --jq '.license.spdx_id'
  #   MIT
  org.opencontainers.image.licenses: "MIT"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: jdx/fnox
  fork: ocx-contrib/index
