name: fnox
target:
  registry: ocx.sh
  repository: fnox

source:
  type: github_release
  owner: jdx
  repo: fnox
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# Pass 1 — Linux only. darwin/windows added in later passes.
assets:
  linux/amd64:
    # Static musl binary — portable across glibc + musl hosts. gnu also
    # ships but listing both is an ambiguous same-version match (hard error).
    - "^fnox-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "^fnox-aarch64-unknown-linux-musl\\.tar\\.gz$"
  # darwin/amd64:
  #   - "^fnox-x86_64-apple-darwin\\.tar\\.gz$"
  # darwin/arm64:
  #   - "^fnox-aarch64-apple-darwin\\.tar\\.gz$"
  # windows/amd64:
  #   - "^fnox-x86_64-pc-windows-msvc\\.zip$"
  # windows/arm64:
  #   - "^fnox-aarch64-pc-windows-msvc\\.zip$"

asset_type:
  type: archive
  strip_components: 0   # binary sits at archive root

metadata:
  default: metadata.json

skip_prereleases: true
cascade: true
build_timestamp: none

versions:
  min: "1.25.0"
  new_per_run: 5

verify:
  github_asset_digest: true

concurrency:
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

tests:
  - name: smoke
    script: tests/smoke.star

platforms:
  linux/amd64:
    runner: ubuntu-latest
  linux/arm64:
    runner: ubuntu-24.04-arm
  # darwin/amd64:
  #   runner: macos-latest
  #   prefix: ["arch", "-x86_64"]
  # darwin/arm64:
  #   runner: macos-latest
  #   shell: bash
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh
  # windows/arm64:
  #   runner: windows-11-arm
  #   shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
